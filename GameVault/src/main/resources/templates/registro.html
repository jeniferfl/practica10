<th:block th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
    <title>Registro - GameVault</title>
    <main class="container">
        <div class="panel" style="max-width: 450px; margin: 40px auto;">

            <h2 class="text-gradient" style="margin-top: 0;">Crear Cuenta</h2>

            <!-- th:object enlaza el formulario con el Usuario vacío que manda el controlador;
                 cada *{campo} se llena en el atributo del mismo nombre -->
            <form th:action="@{/registro}" th:object="${usuario}" method="post">
                <div class="form-group">
                    <label for="nombre" class="form-label">Nombre Completo</label>
                    <input type="text" id="nombre" th:field="*{nombre}" required class="form-control">
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" id="email" th:field="*{email}" required class="form-control">
                </div>

                <div class="form-group">
                    <label for="contrasenia" class="form-label">Contraseña</label>
                    <input type="password" id="contrasenia" th:field="*{contrasenia}" required minlength="6" class="form-control">
                    <small style="color: var(--text-muted);">Mínimo 6 caracteres.</small>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Registrarme</button>
            </form>

            <p style="color: var(--text-muted); text-align: center; margin-bottom: 0;">
                ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión aquí</a>
            </p>
        </div>
    </main>
</th:block>
